name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          # Throwaway CI database, not a secret.
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:3306/emfor?serverVersion=8.0.32&charset=utf8mb4

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, zip
        tools: composer:v2
        coverage: none

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: api/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('api/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      working-directory: ./api
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Create test database
      working-directory: ./api
      run: |
        php bin/console doctrine:database:create --env=test --if-not-exists
        php bin/console doctrine:migrations:migrate --env=test --no-interaction
        php bin/console doctrine:fixtures:load --env=test --no-interaction

    - name: Run tests
      working-directory: ./api
      run: vendor/bin/phpunit

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build (includes type check)
      working-directory: ./frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: frontend/dist

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build API Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./api
        push: false
        tags: emfor-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Frontend Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: false
        tags: emfor-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
